<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieX | Watch Movies and Series Online</title>
  <meta name="description" content="MovieX is a smooth place to discover, search, and watch movies and series online with fresh picks, title details, and instant playback.">
  <meta name="keywords" content="MovieX,movi,watch, watch movies online, watch series online, movies, series, movie search, streaming movies, latest movies 2026, online cinema">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05060d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MovieX | Watch Movies and Series Online">
  <meta property="og:description" content="Discover movies and series, open title details, and start watching from one smooth movie website.">
  <meta property="og:site_name" content="MovieX">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MovieX | Watch Movies and Series Online">
  <meta name="twitter:description" content="Find and watch movies and series online with MovieX.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="/icon.ico">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MovieX",
      "description": "Discover, search, and watch movies and series online."
    }
  </script>
</head>
<body data-page="home">
  <header class="site-header">
    <a class="brand" href="/" aria-label="MovieX">
      <span class="brand-mark">M</span>
      <span class="brand-text">MovieX</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/" aria-current="page">Home</a>
      <a href="/browse/">Search</a>
      <a href="#movies-row">Movies</a>
      <a href="#series-row">Series</a>
    </nav>
    <button class="mobile-search-toggle" type="button" id="mobile-search-open" aria-label="Open search">
      <i class="bxr bx-search" aria-hidden="true"></i>
    </button>
    <form class="nav-search" id="nav-search">
      <label class="sr-only" for="home-search">Search titles</label>
      <input id="home-search" type="search" placeholder="Search movies or series">
      <button class="mobile-search-close" type="button" id="mobile-search-close" aria-label="Close search">
        <i class="bxr bx-x" aria-hidden="true"></i>
      </button>
      <button type="submit" aria-label="Search">
        <i class="bxr bx-search" aria-hidden="true"></i>
        <span>Search</span>
      </button>
    </form>
  </header>

  <main>
    <section class="home-hero" id="hero">
      <div class="hero-backdrop"></div>
      <div class="hero-shade"></div>
      <div class="hero-content">
        <p class="eyebrow">Tonight's spotlight</p>
        <h1 id="hero-title">Loading featured title...</h1>
        <p class="hero-meta" id="hero-meta"></p>
        <p class="hero-plot" id="hero-plot"></p>
        <div class="hero-actions">
          <a class="button button-primary" id="hero-watch" href="/watch/">Play</a>
          <a class="button button-secondary" id="hero-details" href="/details/">More Info</a>
        </div>
      </div>
      <div class="hero-controls" aria-label="Featured title controls">
        <button class="hero-control" type="button" id="hero-prev" aria-label="Previous featured title">&lsaquo;</button>
        <div class="hero-dots" id="hero-dots"></div>
        <button class="hero-control" type="button" id="hero-next" aria-label="Next featured title">&rsaquo;</button>
      </div>
    </section>

    <section class="rail-section hero-picks">
      <div class="section-heading">
        <h2>Suggested for you</h2>
        <div class="rail-controls">
          <button class="icon-button" type="button" data-scroll-target="featured-track" data-scroll="-1" aria-label="Previous suggestions">&lsaquo;</button>
          <button class="icon-button" type="button" data-scroll-target="featured-track" data-scroll="1" aria-label="Next suggestions">&rsaquo;</button>
        </div>
      </div>
      <div class="poster-rail" id="featured-track"></div>
    </section>

    <section class="rail-section" id="movies-row">
      <div class="section-heading">
        <h2>Latest movies</h2>
        <a href="/browse/?type=MOVIE">Explore all</a>
      </div>
      <div class="poster-rail" id="movie-track"></div>
    </section>

    <section class="rail-section" id="series-row">
      <div class="section-heading">
        <h2>Latest series</h2>
        <a href="/browse/?type=TV_SERIES">Explore all</a>
      </div>
      <div class="poster-rail" id="series-track"></div>
    </section>

    <section class="rail-section">
      <div class="section-heading">
        <h2>Because you keep watching</h2>
      </div>
      <div class="wide-rail" id="mixed-track"></div>
    </section>
  </main>

  <script src="/assets/js/endpoints.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
