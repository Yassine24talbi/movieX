<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Movies and Series | MovieX</title>
  <meta name="description" content="Watch selected movies and series on MovieX with a focused online player and suggested titles to continue watching.">
  <meta name="keywords" content="watch movies, watch series, MovieX player, movie player online, series player online, online streaming">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05060d">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MovieX">
  <meta property="og:image" content="https://moviex.buzz/icon.png">
  <meta property="og:description" content="Start watching movies and series online through the MovieX player page.">
  <meta property="og:site_name" content="MovieX">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Watch Movies and Series | MovieX">
  <meta name="twitter:description" content="Watch selected movies and series online on MovieX.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="/icon.ico">
</head>
<body data-page="watch">
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">M</span>
      <span class="brand-text">MovieX</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/browse/">Search</a>
    </nav>
    <button class="back-button bxr bx-caret-left" type="button" data-step-back></button>
  </header>

  <main class="page-main watch-page">
    <section class="watch-title" id="watch-header"></section>
    <section class="player-shell">
      <iframe
        id="player-frame"
        class="player-frame"
        title="Streaming player"
        referrerpolicy="no-referrer"
        allowfullscreen
        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
      </iframe>
    </section>
    <section class="rail-section">
      <div class="section-heading">
        <h2>Watch next</h2>
      </div>
      <div class="poster-rail" id="watch-suggestions"></div>
    </section>
  </main>

  <script src="/assets/js/endpoints.js"></script>
  <script src="/assets/js/navigation.js"></script>
  <script src="/assets/js/watch.js"></script>
</body>
</html>
